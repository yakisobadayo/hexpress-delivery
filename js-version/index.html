<title>Hexpress Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one letterboxed 16:9 pixel canvas on a night ground, a quiet control strip beneath. Single committed night look. */
:root{
  --night:#0b0c21;
  --ink:#ece6ff;
  --muted:#8f88c4;
  --gold:#ffd36b;
  --line:#2c2e6a;
  --font-ui:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-display:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);font-family:var(--font-ui);
  margin:0;box-sizing:border-box;padding-inline:16px;padding-block:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  overflow:hidden;
}
#stage{position:relative;display:flex;justify-content:center;width:100%;flex:1 1 auto;min-height:0;align-items:center}
canvas{
  display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  border-radius:6px;box-shadow:0 0 0 2px var(--line),0 18px 60px rgba(0,0,0,.6);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;outline:none;
}
canvas:focus-visible{box-shadow:0 0 0 2px var(--gold),0 18px 60px rgba(0,0,0,.6)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:13px;color:var(--muted);letter-spacing:.02em;text-align:center}
.keys span{white-space:nowrap}
kbd{font-family:var(--font-ui);font-size:12px;color:var(--ink);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#15163a}
</style>

<div id="stage"><canvas id="game" width="640" height="360" tabindex="0" aria-label="Hexpress Delivery game"></canvas></div>
<div class="keys">
  <span><kbd>Space</kbd> / hold click — fly</span>
  <span><kbd>↓</kbd> / right-click — drop parcel</span>
  <span><kbd>M</kbd> sound</span>
  <span><kbd>P</kbd> pause</span>
  <span><kbd>Esc</kbd> menu</span>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 640, H = 360, CEIL = 30, FLOOR = 322, PX = 200;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const UI = '"Pixelify Sans", ui-monospace, monospace';
const DISPLAY = '"Silkscreen", ui-monospace, monospace';

// ---------- utils ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; fn(g, w, h); return c; }
function spriteFrom(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  return mk(w, h, g => rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } })));
}
function flip(c) { return mk(c.width, c.height, g => { g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); }); }
function silhouette(c, col = '#fff') { return mk(c.width, c.height, g => { g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); }); }
function circleRect(cx, cy, r, x, y, w, h) { const dx = cx - clamp(cx, x, x + w), dy = cy - clamp(cy, y, y + h); return dx * dx + dy * dy < r * r; }
function segDist(px, py, ax, ay, bx, by) { const vx = bx - ax, vy = by - ay; const t = clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy), 0, 1); return Math.hypot(px - ax - vx * t, py - ay - vy * t); }
let store = {};
try { store = JSON.parse(localStorage.getItem('hexpress-js') || '{}') || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem('hexpress-js', JSON.stringify(store)); } catch (e) {} }

// ---------- sprites (hand-authored pixel maps, rendered in code) ----------
const WILLOW_MAP = [
"............kk.............",
"...........kHk.............",
"..........khHk.............",
".........khhHk.............",
"........khhhHHk............",
".......khhhhhHk............",
"......khhhhhhhhk...........",
"...kkkbbbbbbbbbbkkk........",
"..khhhhhhhhhhhhhhhhk.......",
"...kkkrrrsssssssskk........",
".....krrrRssssseskk........",
".....krrRsssssssssk........",
".....krRRsssSSssssk........",
"......kRRkssssssk..........",
".......kkcccccccck.........",
"YY....kddcccDDDdk..........",
"yyY..kdddDDDDDdssk.........",
"yyyYkdddddDDDdddssk........",
"yyyyYkwwwwwwwwwwwwwwwwwwwk.",
"yyyyYkWWWWWWWWWWWWWWWWWWWk.",
"yyyY..kkddk...kddk.........",
"yyY....kkk....kggk.........",
"YY.............kk..........",
];
const WILLOW_PAL = { k:'#1a1433', h:'#3a3f9e', H:'#6a78e6', b:'#f4c542', r:'#e8783a', R:'#b8542a', s:'#f9c9a4', S:'#ef9a8a', e:'#1a1433', d:'#3c2f86', D:'#5a48b8', c:'#d23f5e', w:'#a8703c', W:'#6d4222', y:'#f2c46a', Y:'#c08a3a', g:'#5a3a2a' };
const RIVAL_PAL = Object.assign({}, WILLOW_PAL, { h:'#2c6b45', H:'#4fb06e', b:'#c9f05a', r:'#2b2340', R:'#18122a', d:'#5a1f4f', D:'#8a3070', c:'#7a2bb0', s:'#cfe6b8', S:'#a6c98e' });
const SPR = {};
SPR.willow = spriteFrom(WILLOW_MAP, WILLOW_PAL);
SPR.willowWhite = silhouette(SPR.willow);
SPR.rivals = [RIVAL_PAL,
  Object.assign({}, RIVAL_PAL, { h:'#5b1e1e', H:'#a33a3a', b:'#ffb347', d:'#24243a', D:'#3d3d5c' }),
  Object.assign({}, RIVAL_PAL, { h:'#1c1c26', H:'#4a4a66', b:'#9ff3ff', r:'#e9e9f2', R:'#b3b3c4', s:'#f9c9a4', S:'#ef9a8a' }),
].map(p => flip(spriteFrom(WILLOW_MAP, p)));
const BIRD_PAL = { k:'#120e22', n:'#3a3358', N:'#62598c', o:'#f0a040', e:'#ffe066' };
SPR.bird = [
  spriteFrom([
"......kk......",
".....knk..kk..",
"....knNk.knk..",
"...knNNkknk...",
".kkknnnnnnkk..",
"kooknennnnnnk.",
".kknnnnnnnnkkk",
"...kknnnnkk...",
".....kkkk.....",
"..............",
], BIRD_PAL),
  spriteFrom([
"..............",
"..............",
"..............",
"....kkkkkkkk..",
".kkknnnnnnnnkk",
"kooknennnnnnk.",
".kknnNNNnnkkk.",
"...knNNNNk....",
"....knNNk.....",
".....kkk......",
], BIRD_PAL)];
SPR.potion = spriteFrom([
"....kkkk....",
"....kwwk....",
"....kkkk....",
".....kgk....",
".....kgk....",
"...kkgggkk..",
"..kgxgggggk.",
".kgxfffffffk",
".kxlllllllLk",
".kxlllllLLLk",
".kllllllLLLk",
".kllllllLLLk",
"..kllllLLLk.",
"...kkkkkkk..",
], { k:'#1a1433', w:'#c99a5a', g:'#bfe6ff', x:'#ffffff', f:'#f7e3c2', l:'#8a4a26', L:'#5e2f17' });
SPR.star = spriteFrom([
"...k...",
"..kyk..",
"kkkyykk",
"kyyyyyk",
".kyyyk.",
".kykyk.",
".k...k.",
], { k:'#3a2410', y:'#ffd36b' });
SPR.coin = spriteFrom([
"..kkkk..",
".kyyyyk.",
"kyYyyyyk",
"kyYyyYyk",
"kyYyyYyk",
"kyyyyYyk",
".kyyyyk.",
"..kkkk..",
], { k:'#7a4a10', y:'#ffd36b', Y:'#fff3b0' });

// Parcel drawn procedurally at any pixel scale, with damage states (4 = pristine)
function drawParcel(g, x, y, s, hits) {
  const R = (px, py, w, h, c) => { g.fillStyle = c; g.fillRect(x + px * s, y + py * s, w * s, h * s); };
  R(0, 0, 14, 11, '#3a2410');
  R(1, 1, 12, 9, '#d98a45');
  R(1, 1, 12, 2, '#eaa45e');
  R(1, 8, 12, 2, '#b86c30');
  R(6, 1, 2, 9, '#f2dfae');
  R(2, 4, 3, 3, '#3a3f9e'); R(3, 5, 1, 1, '#f4c542');
  if (hits <= 3) { R(10, 2, 2, 1, '#8a5020'); R(11, 3, 1, 2, '#8a5020'); }
  if (hits <= 2) { R(2, 8, 3, 1, '#7a4418'); R(9, 6, 1, 3, '#7a4418'); R(1, 0, 3, 1, '#d98a45'); }
  if (hits <= 1) { R(4, 2, 1, 1, '#3a2410'); R(5, 3, 1, 2, '#3a2410'); R(4, 5, 1, 2, '#3a2410'); R(11, 7, 2, 2, '#3a2410'); R(6, 0, 2, 1, '#3a2410'); }
  if (hits <= 0) { R(0, 4, 2, 2, '#3a2410'); R(12, 1, 2, 2, '#3a2410'); R(7, 3, 4, 1, '#3a2410'); R(8, 4, 1, 3, '#3a2410'); }
}

// Delivery houses, generated per seed
const HOUSE_W = 160, HOUSE_H = 150, PORCH_L = 56, PORCH_R = 104;
function makeHouse(seed) {
  const r = mulberry(seed);
  const brick = ['#b4553b', '#7d5aa0', '#4f7fa8', '#5d8f6a', '#c27a3e', '#a8476b'][Math.floor(r() * 6)];
  const roof = ['#55597a', '#3c4b6e', '#5a4766', '#3f5a5a'][Math.floor(r() * 4)];
  const door = ['#2f2a5a', '#5a2a2a', '#2a4a3a', '#6a4a20'][Math.floor(r() * 4)];
  return mk(HOUSE_W, HOUSE_H, g => {
    const glow = (cx, cy, rad) => { const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad); gr.addColorStop(0, 'rgba(255,200,110,.45)'); gr.addColorStop(1, 'rgba(255,200,110,0)'); g.fillStyle = gr; g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2); };
    // chimney
    g.fillStyle = '#1a1433'; g.fillRect(118, 0, 16, 26);
    g.fillStyle = brick; g.fillRect(120, 2, 12, 24);
    g.fillStyle = '#1a1433'; g.fillRect(116, 0, 20, 4);
    // mansard roof
    g.fillStyle = '#1a1433'; g.beginPath(); g.moveTo(6, 46); g.lineTo(20, 10); g.lineTo(140, 10); g.lineTo(154, 46); g.fill();
    g.fillStyle = roof; g.beginPath(); g.moveTo(10, 44); g.lineTo(22, 13); g.lineTo(138, 13); g.lineTo(150, 44); g.fill();
    g.fillStyle = 'rgba(255,255,255,.08)'; for (let yy = 17; yy < 44; yy += 5) g.fillRect(14, yy, 132, 1);
    // dormers
    for (const dx of [36, 100]) {
      g.fillStyle = '#1a1433'; g.fillRect(dx - 2, 16, 28, 26);
      g.fillStyle = '#d8d4e8'; g.fillRect(dx, 18, 24, 22);
      g.fillStyle = r() < .6 ? '#ffd47a' : '#3a3c6a'; g.fillRect(dx + 4, 22, 16, 16);
      g.fillStyle = '#1a1433'; g.fillRect(dx + 11, 22, 2, 16); g.fillRect(dx + 4, 29, 16, 2);
    }
    // body
    g.fillStyle = '#1a1433'; g.fillRect(2, 44, 156, 106);
    g.fillStyle = brick; g.fillRect(4, 46, 152, 104);
    g.fillStyle = 'rgba(0,0,0,.16)';
    for (let yy = 50; yy < 150; yy += 6) { g.fillRect(4, yy, 152, 1); for (let xx = 4 + ((yy / 6) % 2) * 6; xx < 156; xx += 12) g.fillRect(xx, yy - 5, 1, 5); }
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(4, 46, 152, 2);
    g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(140, 46, 16, 104);
    // cornice band
    g.fillStyle = '#e6e0f2'; g.fillRect(2, 44, 156, 4); g.fillRect(2, 92, 156, 3);
    // upper windows
    for (const wx of [28, 104]) {
      const lit = r() < .75;
      if (lit) glow(wx + 14, 72, 34);
      g.fillStyle = '#e6e0f2'; g.fillRect(wx - 3, 56, 34, 32);
      g.fillStyle = lit ? '#ffcf6b' : '#363866'; g.fillRect(wx, 59, 28, 26);
      if (lit) { g.fillStyle = '#c9504e'; g.fillRect(wx, 59, 6, 26); g.fillRect(wx + 22, 59, 6, 26); }
      g.fillStyle = '#1a1433'; g.fillRect(wx + 13, 59, 2, 26); g.fillRect(wx, 71, 28, 2);
      g.fillStyle = '#e6e0f2'; g.fillRect(wx - 5, 87, 38, 3);
    }
    // ground windows
    for (const wx of [18, 114]) {
      const lit = r() < .6;
      if (lit) glow(wx + 14, 122, 28);
      g.fillStyle = '#e6e0f2'; g.fillRect(wx - 3, 106, 34, 28);
      g.fillStyle = lit ? '#ffcf6b' : '#363866'; g.fillRect(wx, 109, 28, 22);
      g.fillStyle = '#1a1433'; g.fillRect(wx + 13, 109, 2, 22);
    }
    // door + lamp
    glow(98, 108, 22);
    g.fillStyle = '#e6e0f2'; g.fillRect(66, 100, 28, 46);
    g.fillStyle = door; g.fillRect(69, 104, 22, 42);
    g.fillStyle = '#ffcf6b'; g.fillRect(72, 106, 16, 8);
    g.fillStyle = '#1a1433'; g.fillRect(79, 106, 2, 8);
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(72, 118, 7, 24); g.fillRect(81, 118, 7, 24);
    g.fillStyle = '#f4c542'; g.fillRect(86, 128, 2, 2);
    g.fillStyle = '#1a1433'; g.fillRect(97, 104, 4, 8); g.fillStyle = '#ffe9a8'; g.fillRect(98, 106, 2, 4);
    // porch step
    g.fillStyle = '#1a1433'; g.fillRect(PORCH_L - 2, 144, PORCH_R - PORCH_L + 4, 6);
    g.fillStyle = '#c8c0dc'; g.fillRect(PORCH_L, 145, PORCH_R - PORCH_L, 5);
    g.fillStyle = '#9890b4'; g.fillRect(PORCH_L, 148, PORCH_R - PORCH_L, 2);
  });
}
function makeCar(col) {
  return mk(64, 30, g => {
    g.fillStyle = '#1a1433';
    g.fillRect(14, 1, 34, 13); g.fillRect(1, 11, 62, 15);
    g.fillStyle = col; g.fillRect(16, 3, 30, 11); g.fillRect(3, 13, 58, 11);
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(3, 13, 58, 2);
    g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(3, 20, 58, 4);
    g.fillStyle = '#9fd6ff'; g.fillRect(18, 5, 12, 8); g.fillRect(32, 5, 12, 8);
    g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(19, 6, 3, 2); g.fillRect(33, 6, 3, 2);
    g.fillStyle = '#ffe9a8'; g.fillRect(2, 15, 4, 4);
    g.fillStyle = '#ff4a5a'; g.fillRect(59, 15, 3, 4);
    g.fillStyle = '#1a1433'; g.fillRect(30, 15, 1, 8);
  });
}
const CAR_COLORS = ['#e05a4e', '#4ea0e0', '#f0c040', '#7ad070', '#c070e0', '#f08a3a'];
function makeCrystal(h) {
  return mk(30, h, g => {
    const prism = (x, w, top, col, hi) => {
      g.fillStyle = '#1a1433'; g.beginPath(); g.moveTo(x - 1, h); g.lineTo(x - 1, top + w / 2); g.lineTo(x + w / 2, top - 1); g.lineTo(x + w + 1, top + w / 2); g.lineTo(x + w + 1, h); g.fill();
      g.fillStyle = col; g.beginPath(); g.moveTo(x, h); g.lineTo(x, top + w / 2); g.lineTo(x + w / 2, top); g.lineTo(x + w, top + w / 2); g.lineTo(x + w, h); g.fill();
      g.fillStyle = hi; g.fillRect(x + 2, top + w / 2, 2, h - top - w / 2 - 2);
    };
    prism(2, 8, Math.round(h * .35), '#6e5ce0', '#a99cff');
    prism(20, 8, Math.round(h * .25), '#4a8ff0', '#9fd0ff');
    prism(9, 12, 0, '#62e6ff', '#e6fcff');
    // flip so shards hang from both ends for floating clusters
  });
}

// ---------- backdrop layers (procedural, seamless tiles) ----------
const BG = {};
BG.sky = mk(W, H, g => {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#0e1030'); gr.addColorStop(.45, '#222266'); gr.addColorStop(.8, '#4a3a7e'); gr.addColorStop(1, '#6a4a86');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
});
BG.stars = Array.from({ length: 110 }, () => ({ x: Math.random() * W, y: Math.random() * (FLOOR - 120), p: Math.random() * 6.28, s: Math.random() < .15 ? 2 : 1 }));
BG.moon = mk(120, 120, g => {
  const gr = g.createRadialGradient(60, 60, 18, 60, 60, 60); gr.addColorStop(0, 'rgba(255,240,200,.35)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 120, 120);
  g.fillStyle = '#f8f0cc'; g.beginPath(); g.arc(60, 60, 26, 0, 7); g.fill();
  g.fillStyle = '#e2d6a8'; [[50, 52, 5], [68, 66, 7], [64, 46, 3], [48, 70, 3]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
  g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(52, 50, 2, 0, 7); g.fill();
});
function tile(w, h, seed, fn) { const r = mulberry(seed); return mk(w, h, g => { for (const ox of [0, -w, w]) { const rr = mulberry(seed); g.save(); g.translate(ox, 0); fn(g, rr, w, h); g.restore(); } }); }
BG.clouds = tile(W, H, 7, (g, r, w) => {
  for (let i = 0; i < 9; i++) {
    const x = r() * w, y = 40 + r() * 120, s = 10 + r() * 18;
    g.fillStyle = 'rgba(190,170,240,.045)';
    for (let k = 0; k < 6; k++) { g.beginPath(); g.arc(x + k * s * .8, y + Math.sin(k * 1.7) * s * .3, s * (0.7 + r() * .5), 0, 7); g.fill(); }
  }
});
BG.city = tile(W, H, 11, (g, r, w) => {
  let x = 0; const base = FLOOR - 24;
  while (x < w) {
    const bw = 18 + Math.floor(r() * 30), bh = 40 + Math.floor(r() * 90);
    g.fillStyle = '#1e1f52'; g.fillRect(x, base - bh, bw, bh + 30);
    const type = r();
    if (type < .25) { g.beginPath(); g.moveTo(x - 2, base - bh); g.lineTo(x + bw / 2, base - bh - 26 - r() * 20); g.lineTo(x + bw + 2, base - bh); g.fill(); }
    else if (type < .4) { g.beginPath(); g.arc(x + bw / 2, base - bh, bw / 2, Math.PI, 0); g.fill(); g.fillRect(x + bw / 2 - 1, base - bh - bw / 2 - 10, 2, 10); }
    for (let wy = base - bh + 6; wy < base; wy += 8) for (let wx = x + 3; wx < x + bw - 4; wx += 6) if (r() < .18) { g.fillStyle = r() < .8 ? '#e8b85a' : '#9ff3ff'; g.fillRect(wx, wy, 2, 3); }
    x += bw + Math.floor(r() * 6);
  }
});
BG.houses = tile(W, H, 23, (g, r, w) => {
  let x = 0; const base = FLOOR - 4;
  while (x < w) {
    const bw = 36 + Math.floor(r() * 26), bh = 30 + Math.floor(r() * 26);
    g.fillStyle = '#2a2b66'; g.fillRect(x, base - bh, bw, bh + 10);
    g.fillStyle = '#20214f'; g.beginPath(); g.moveTo(x - 4, base - bh); g.lineTo(x + bw / 2, base - bh - 18 - r() * 10); g.lineTo(x + bw + 4, base - bh); g.fill();
    if (r() < .6) { g.fillRect(x + bw * .7, base - bh - 20, 6, 14); }
    for (let k = 0; k < 2; k++) if (r() < .55) { g.fillStyle = '#e8b85a'; g.fillRect(x + 6 + k * (bw - 18), base - bh + 8, 6, 7); }
    x += bw + 4 + Math.floor(r() * 14);
  }
});
BG.trees = tile(W, H, 31, (g, r, w) => {
  let x = 0; const base = FLOOR;
  while (x < w) {
    const s = 12 + r() * 14;
    g.fillStyle = '#16283e'; g.fillRect(x - 2, base - s * 2, 4, s * 2);
    g.fillStyle = '#183a4c'; for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(x + (k - 1.5) * s * .5, base - s * 2.2 - (k % 2) * s * .4, s * .75, 0, 7); g.fill(); }
    g.fillStyle = '#21506a'; g.beginPath(); g.arc(x - s * .3, base - s * 2.6, s * .35, 0, 7); g.fill();
    x += s * 2 + r() * 60;
  }
});

    const ry = y + 56 + i * 15, show = clamp((G.resultsT - 20 - i * 6) / 10, 0, 1);
    if (!show) return;
    text(a, x + 20, ry, { size: 11, col: i === 1 ? '#8f88c4' : '#ece6ff', weight: i === 1 ? 400 : 600, alpha: show });
    text(b, x + pw - 20, ry, { size: 11, col: i === 0 ? '#ffd36b' : '#ece6ff', weight: 700, align: 'right', alpha: show });
  });
  if (G.newBest && G.resultsT > 60) { const s = 1 + Math.sin(T * .2) * .08; ctx.save(); ctx.translate(x + pw - 30, y + 18); ctx.rotate(.25); ctx.scale(s, s); panel(-30, -9, 60, 18, '#d23f5e', '#ffd36b'); text('NEW BEST', 0, -5, { size: 9, col: '#fff', align: 'center', weight: 700, font: DISPLAY, shadow: null }); ctx.restore(); }
  if (G.resultsT > 40) { const k = Math.floor(T / 30) % 2; text(isTouch ? 'Tap to fly again · Esc for menu' : 'SPACE to fly again · ESC for menu', W / 2, y + ph - 22, { size: 11, col: k ? '#ffffff' : '#9ff3ff', align: 'center', weight: 600 }); }
}
function drawMenu() {
  const t = menuT;
  // Willow loops around the left side
  const wx = 150 + Math.sin(t * .02) * 60, wy = 200 + Math.sin(t * .04) * 40;
  const vy = Math.cos(t * .04) * 40 * .04;
  if (t % 3 === 0) part({ type: 'spark', x: wx - 12, y: wy + 7, vx: -1.5, vy: rnd(-.3, .3), life: 40, size: rnd(2, 4), col: pick(['#9ff3ff', '#ffd36b', '#ffffff', '#c9a8ff']) });
  drawParticles();
  drawWillow(wx, wy, { tilt: -vy * .4, squash: 1 + Math.sin(t * .1) * .03 });
  // parcel dangling
  drawParcel(ctx, Math.round(wx - 2), Math.round(wy + 12 + Math.sin(t * .1) * 1), 1, 4);
  // title
  const title1 = 'HEXPRESS', title2 = 'DELIVERY';
  const tx = 410;
  ctx.font = `700 40px ${DISPLAY}`;
  const drawWord = (word, y, size, col, ph) => {
    ctx.font = `700 ${size}px ${DISPLAY}`; let total = ctx.measureText(word).width, x = tx - total / 2;
    [...word].forEach((ch, i) => {
      const w = ctx.measureText(ch).width, dy = Math.sin(t * .06 + i * .5 + ph) * 3;
      text(ch, x, y + dy, { size, col, weight: 700, font: DISPLAY, shadow: '#0d0b26' });
      x += w;
    });
  };
  drawWord(title1, 70, 40, '#ffd36b', 0);
  drawWord(title2, 112, 30, '#9ff3ff', 1.5);
  text('A witch-themed night shift', tx, 152, { size: 12, col: '#c9c2f0', align: 'center', weight: 400 });
  // play button with wobbling selector
  const py = 200, sel = 30 + 2.5 * Math.sin(t * .06);
  const s = 1 + .06 * Math.sin(t * .06);
  ctx.save(); ctx.translate(tx, py + 12); ctx.scale(s, s);
  panel(-54, -16, 108, 32, '#3a3f9e', '#ece6ff');
  text('PLAY', 0, -8, { size: 16, col: '#ffffff', align: 'center', weight: 700, font: DISPLAY });
  ctx.restore();
  ctx.drawImage(SPR.star, Math.round(tx - 54 - sel + 12), py + 9);
  text(isTouch ? 'Tap to start' : 'Press SPACE or click', tx, py + 36, { size: 11, col: '#8f88c4', align: 'center', weight: 400 });
  if (store.best) text('Best shift: $' + store.best + (store.bestStreak ? ' · streak ' + store.bestStreak : ''), tx, py + 54, { size: 11, col: '#ffd36b', align: 'center', weight: 600 });
}
function render() {
  ctx.save();
  const sh = REDUCED ? 0 : shake * shake * 7;
  if (sh > 0) ctx.translate(Math.round(rnd(-sh, sh)), Math.round(rnd(-sh, sh)));
  drawBackdrop();
  if (scene === 'menu') {
    drawGround(); drawCeiling();
    drawMenu();
    ctx.drawImage(BG.vignette, 0, 0);
    ctx.restore(); drawSoundBtn(); return;
  }
  const back = G.ents.filter(e => e.kind === 'house');
  back.forEach(drawEnt);
  drawGround();
  G.ents.filter(e => e.kind !== 'house' && e.kind !== 'parcel').forEach(drawEnt);
  drawDropGuide();
  drawParticles();
  G.ents.filter(e => e.kind === 'parcel').forEach(drawEnt);
  drawPlayer();
  drawCeiling();
  drawBirdWarnings();
  drawPops();
  ctx.restore();
  if (G.stamina < 33) { ctx.globalAlpha = clamp((33 - G.stamina) / 33, 0, 1) * (.6 + .4 * Math.sin(T * .05)); ctx.drawImage(BG.sleepy, 0, 0); ctx.globalAlpha = 1; }
  ctx.drawImage(BG.vignette, 0, 0);
  if (flash > 0 && !REDUCED) { ctx.globalAlpha = flash; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (G.state !== 'pending') drawHUD();
  drawBanner();
  drawDropButton();
  drawSoundBtn();
  if (G.state === 'pending') drawTutorial();
  if (G.results) drawResults();
  if (G.paused) { ctx.fillStyle = 'rgba(8,6,28,.6)'; ctx.fillRect(0, 0, W, H); text('PAUSED', W / 2, H / 2 - 16, { size: 22, col: '#ffd36b', align: 'center', weight: 700, font: DISPLAY }); text('Press P or click to resume', W / 2, H / 2 + 14, { size: 12, col: '#c9c2f0', align: 'center' }); }
}

// ---------- loop & sizing ----------
function fit() {
  const stage = document.getElementById('stage');
  const aw = stage.clientWidth, ah = stage.clientHeight || innerHeight * .8;
  let w = Math.min(aw, ah * 16 / 9);
  if (w >= 640) w = Math.floor(w / 320) * 320 || w; // prefer clean pixel multiples on big screens
  cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(w * 9 / 16) + 'px';
}
addEventListener('resize', fit); fit();
cv.addEventListener('pointerdown', () => { if (G && G.paused) G.paused = false; }, true);
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
const start = () => requestAnimationFrame(t => { last = t; frame(t); });
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load(`700 16px ${DISPLAY}`), document.fonts.load(`600 12px ${UI}`)]).catch(() => {}) : Promise.resolve()).then(start);
window.__hex = { get G() { return G; }, get scene() { return scene; }, input };
})();
</script>
