<title>Hexpress Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Grandstander:wght@600;800;900&display=swap">
<style>
  /* Layout: one letterboxed 16:9 canvas, centred on a dusk-plum ground. Single dark look by choice. */
  :root {
    --ground: #1c1433;
    --ground-2: #2a1d4a;
    --ink: #f3ecff;
    color-scheme: dark;
  }
  html { height: 100%; box-sizing: border-box; background: var(--ground); }
  body {
    height: 100%;
    margin: 0;
    background: radial-gradient(120% 90% at 50% 40%, var(--ground-2), var(--ground));
    color: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #stage {
    display: block;
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 0 2px rgba(255, 255, 255, .06);
    outline: none;
    touch-action: none;
  }
  #stage:focus-visible { box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 0 3px #ffcf4d; }
</style>

<canvas id="stage" tabindex="0" aria-label="Hexpress Delivery. Hold Space or click to fly, press Down or right-click to drop the parcel."></canvas>

<script>
(() => {
'use strict';

// ===================================================================
//  Constants (logical resolution matches the original 640x360 view)
// ===================================================================
const W = 640, H = 360;
const CEIL = 19, FLOOR = 339;        // play-field bounds
const PX = 240;                       // Willow's fixed x
const HW = 8, HH = 13;                // Willow's hitbox half-size
const GRAV = 0.15;
const TAU = Math.PI * 2;
const INK = '#2a1d3f';
const FONT_UI = '"Grandstander", "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const FONT_D = '"Bagel Fat One", "Arial Black", Impact, system-ui, sans-serif';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('stage');
const X = canvas.getContext('2d');
let S = 1;

// ===================================================================
//  Small helpers
// ===================================================================
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choose = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t, 0, 1));
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function keyed(keys, t) {
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const u = (t - a[0]) / (b[0] - a[0]); return a.slice(1).map((c, j) => typeof c === 'string' ? mix(c, b[j + 1], u) : lerp(c, b[j + 1], u)); }
  }
  return keys[keys.length - 1].slice(1);
}
const rectHit = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
function circleRect(cx, cy, r, R) { const nx = clamp(cx, R.l, R.r), ny = clamp(cy, R.t, R.b); return (cx - nx) ** 2 + (cy - ny) ** 2 <= r * r; }

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function starPath(g, x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n; const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r; i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.closePath();
}
function heartPath(g, x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * 0.4);
  g.bezierCurveTo(x - s * 1.2, y - s * 0.3, x - s * 0.55, y - s * 1.15, x, y - s * 0.45);
  g.bezierCurveTo(x + s * 0.55, y - s * 1.15, x + s * 1.2, y - s * 0.3, x, y + s * 0.4); g.closePath();
}
function hexPath(g, x, y, r) { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * TAU / 6; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); }
function boltPath(g, x, y, s) { g.beginPath(); g.moveTo(x + 1 * s, y - 5 * s); g.lineTo(x - 3 * s, y + 0.8 * s); g.lineTo(x - 0.2 * s, y + 0.8 * s); g.lineTo(x - 1 * s, y + 5 * s); g.lineTo(x + 3 * s, y - 1 * s); g.lineTo(x + 0.2 * s, y - 1 * s); g.closePath(); }

function text(g, s, x, y, o = {}) {
  const size = o.size || 14, font = o.font || FONT_UI, weight = o.weight ?? (font === FONT_D ? 400 : 800);
  g.font = `${weight} ${size}px ${font}`;
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'middle';
  g.lineJoin = 'round';
  if (o.shadow) {
    if (o.stroke) { g.lineWidth = o.sw || 3; g.strokeStyle = o.shadow; g.strokeText(s, x, y + (o.sdy ?? 2.5)); }
    g.fillStyle = o.shadow; g.fillText(s, x, y + (o.sdy ?? 2.5));
  }
  if (o.stroke) { g.lineWidth = o.sw || 3; g.strokeStyle = o.stroke; g.strokeText(s, x, y); }
  g.fillStyle = o.color || '#fff'; g.fillText(s, x, y);
}

// ===================================================================
//  Audio: everything is synthesised (Web Audio)
// ===================================================================
const AU = { ctx: null, master: null, mus: null, sfx: null, wind: null, musicOn: true, sfxOn: true, noise: null, windOn: false };
try { const s = JSON.parse(localStorage.getItem('hexpress.audio') || '{}'); if (s.m === false) AU.musicOn = false; if (s.s === false) AU.sfxOn = false; } catch (e) { /* storage unavailable */ }
function saveAudio() { try { localStorage.setItem('hexpress.audio', JSON.stringify({ m: AU.musicOn, s: AU.sfxOn })); } catch (e) { /* ignore */ } }

function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try {
    const c = AU.ctx = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.connect(c.destination);
    AU.master = c.createGain(); AU.master.gain.value = 0.85; AU.master.connect(comp);
    AU.mus = c.createGain(); AU.mus.gain.value = AU.musicOn ? 0.5 : 0; AU.mus.connect(AU.master);
    AU.sfx = c.createGain(); AU.sfx.gain.value = AU.sfxOn ? 0.9 : 0; AU.sfx.connect(AU.master);
    const len = c.sampleRate; const b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = b;
    const src = c.createBufferSource(); src.buffer = b; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
    const wg = c.createGain(); wg.gain.value = 0;
    src.connect(bp); bp.connect(wg); wg.connect(AU.sfx); src.start();
    AU.wind = { g: wg, f: bp };
  } catch (e) { AU.ctx = null; }
}

function osc(type, f0, f1, t0, dur, vol, o = {}) {
  const c = AU.ctx; if (!c) return;
  const t = c.currentTime + t0;
  const o1 = c.createOscillator(); o1.type = type; o1.frequency.setValueAtTime(f0, t);
  if (f1) o1.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.a || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = o1;
  if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
  node.connect(g); g.connect(o.dest || AU.sfx);
  o1.start(t); o1.stop(t + dur + 0.05);
  if (o.vib) { const l = c.createOscillator(); l.frequency.value = o.vib[0]; const lg = c.createGain(); lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(o1.frequency); l.start(t); l.stop(t + dur + 0.05); }
}
function nz(t0, dur, vol, ftype, f0, f1, q = 1, dest) {
  const c = AU.ctx; if (!c || !AU.noise) return;
  const t = c.currentTime + t0;
  const s = c.createBufferSource(); s.buffer = AU.noise;
  const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = q; f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || AU.sfx);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const SFX = {
  boing() { osc('sine', 150, 560, 0, 0.24, 0.32, { vib: [28, 30] }); osc('triangle', 300, 1100, 0, 0.16, 0.07); },
  caw() { [0, 0.15].forEach(d => { osc('sawtooth', 860, 520, d, 0.13, 0.1, { lp: 2400 }); nz(d, 0.11, 0.05, 'bandpass', 1500, 900, 3); }); },
  ding() { osc('sine', 1318.5, null, 0, 0.75, 0.2); osc('sine', 2637, null, 0, 0.4, 0.06); osc('triangle', 1975.5, null, 0.02, 0.5, 0.04); },
  impact() { nz(0, 0.16, 0.5, 'lowpass', 1500, 180, 0.7); osc('sine', 160, 45, 0, 0.2, 0.5); },
  fragile() { SFX.impact(); nz(0.02, 0.28, 0.22, 'highpass', 2500, 6500, 0.6); osc('square', 420, 110, 0, 0.2, 0.06, { lp: 1800 }); },
  cash() { osc('square', 1568, null, 0, 0.06, 0.07, { lp: 5000 }); osc('square', 2093, null, 0.07, 0.3, 0.07, { lp: 6000 }); nz(0.07, 0.25, 0.05, 'highpass', 6000, 9000, 0.5); },
  tick(n) { osc('square', 760 + Math.min(n, 50) * 16, null, 0, 0.03, 0.028, { lp: 3200 }); },
  coin() { osc('square', 1975, 2637, 0, 0.05, 0.03, { lp: 4000 }); },
  place() { osc('sine', 220, 90, 0, 0.16, 0.3); nz(0, 0.1, 0.15, 'lowpass', 500, 200, 0.7); },
  restore() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => osc('triangle', f, null, i * 0.06, 0.2, 0.13)); osc('sine', 2093, null, 0.24, 0.35, 0.05); },
  yawn() { osc('sawtooth', 330, 165, 0, 1.1, 0.1, { lp: 850, vib: [5, 7], a: 0.18 }); osc('sine', 660, 330, 0, 1.0, 0.03, { a: 0.2 }); },
  hover() { osc('sine', 1046, null, 0, 0.05, 0.04); },
  press() { osc('square', 523, 1046, 0, 0.09, 0.05, { lp: 2500 }); },
  whoosh() { nz(0, 0.22, 0.2, 'bandpass', 500, 2400, 1.2); },
  pop() { osc('sine', 480, 1300, 0, 0.1, 0.14); },
  thud() { nz(0, 0.09, 0.16, 'lowpass', 420, 150, 0.7); osc('sine', 120, 55, 0, 0.09, 0.16); },
  star(i) { const f = [784, 880, 988, 1175, 1568][i] || 1568; osc('sine', f, null, 0, 0.28, 0.12); osc('triangle', f * 2, null, 0, 0.12, 0.03); },
  miss() { osc('triangle', 392, 185, 0, 0.4, 0.13); osc('triangle', 294, 139, 0.12, 0.4, 0.1); },
  nope() { osc('square', 180, 150, 0, 0.08, 0.04, { lp: 900 }); },
  streak() { [659.25, 830.6, 987.8].forEach((f, i) => osc('square', f, null, i * 0.05, 0.12, 0.045, { lp: 3500 })); },
  go() { [392, 523.25, 659.25, 783.99].forEach((f, i) => osc('square', f, null, i * 0.07, 0.16, 0.05, { lp: 3000 })); },
  sleep() { [659.25, 523.25, 440, 329.6].forEach((f, i) => osc('triangle', f, null, i * 0.16, 0.35, 0.12)); },
  honk() { osc('square', 330, 320, 0, 0.12, 0.05, { lp: 1400 }); osc('square', 415, 400, 0, 0.12, 0.04, { lp: 1400 }); },
  boo() { osc('sine', 300, 180, 0, 0.45, 0.12, { vib: [7, 18], a: 0.05 }); },
};
function sfx(name, ...a) { if (!AU.ctx || !AU.sfxOn) return; try { SFX[name](...a); } catch (e) { /* ignore */ } }
function setWind(on, pitch) {
  if (!AU.wind) return;
  const t = AU.ctx.currentTime;
  AU.wind.g.gain.setTargetAtTime(on && AU.sfxOn ? 0.05 : 0, t, 0.08);
  AU.wind.f.frequency.setTargetAtTime(pitch, t, 0.1);
}

// ---- Music: a procedural 8-bar loop in A minor with a harmonic-minor turnaround
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function n2f(n) { const m = /^([A-G])(#|b)?(-?\d)$/.exec(n); const s = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); return 440 * Math.pow(2, ((+m[3] + 1) * 12 + s - 69) / 12); }
const BPM = 132, EIGHTH = 60 / BPM / 2;
const MEL = [
  'A4 - C5 E5 A5 - G5 E5', 'F5 - E5 C5 A4 - C5 -', 'G4 - C5 E5 G5 - F5 E5', 'D5 - B4 G4 D5 - . .',
  'A4 - C5 E5 A5 - B5 C6', 'A5 - F5 A5 C6 - A5 F5', 'G5 - D5 B4 G5 F5 D5 B4', 'G#5 - E5 B4 G#4 - B4 .'
].map(s => s.split(' '));
const MEL2 = [
  'E5 . E5 A5 C6 - B5 A5', 'C6 - A5 F5 C5 - F5 A5', 'G5 . G5 E5 C5 - E5 G5', 'B5 - G5 D5 B4 - D5 .',
  'C6 - B5 A5 E5 - A5 C6', 'F5 - E5 C5 A4 - C5 F5', 'D5 - B4 G4 D5 - G5 B5', 'E5 - D5 B4 G#4 - E4 .'
].map(s => s.split(' '));
const CHORDS = [['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['C4', 'E4', 'G4'], ['G3', 'B3', 'D4'], ['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['G3', 'B3', 'D4'], ['E3', 'G#3', 'B3']];
const BASS = [['A2', 'E2'], ['F2', 'C3'], ['C2', 'G2'], ['G2', 'D3'], ['A2', 'E2'], ['F2', 'C3'], ['G2', 'D3'], ['E2', 'B2']];
const M = { playing: false, step: 0, next: 0, timer: null };
function musicStart() {
  if (!AU.ctx || M.playing) return;
  M.playing = true; M.step = 0; M.next = AU.ctx.currentTime + 0.08;
  M.timer = setInterval(musicTick, 25);
  AU.mus.gain.setTargetAtTime(AU.musicOn ? 0.5 : 0, AU.ctx.currentTime, 0.05);
}
function musicStop() { if (M.timer) clearInterval(M.timer); M.timer = null; M.playing = false; }
function musicLevel(v, tc = 0.6) { if (AU.ctx) AU.mus.gain.setTargetAtTime(AU.musicOn ? v : 0, AU.ctx.currentTime, tc); }
function musicTick() {
  const c = AU.ctx; if (!c) return;
  if (M.next < c.currentTime - 0.05) M.next = c.currentTime + 0.05;
  while (M.next < c.currentTime + 0.12) { playStep(M.step, M.next - c.currentTime); M.next += EIGHTH; M.step = (M.step + 1) % 128; }
}
function playStep(step, t) {
  const bar = Math.floor(step / 8) % 8, loop = Math.floor(step / 64), e = step % 8;
  const D = AU.mus;
  const mel = (loop ? MEL2 : MEL)[bar], tok = mel[e];
  if (tok !== '-' && tok !== '.') {
    let holds = 0; for (let i = e + 1; i < 8 && mel[i] === '-'; i++) holds++;
    const dur = (1 + holds) * EIGHTH * 0.92;
    osc('square', n2f(tok), null, t, dur, 0.055, { lp: 2600, vib: [5.5, 3], dest: D, a: 0.01 });
    osc('triangle', n2f(tok) * 2, null, t, Math.min(dur, 0.12), 0.02, { dest: D });
  }
  const ch = CHORDS[bar], arp = [0, 1, 2, 3, 2, 1, 0, 2][e];
  const f = arp === 3 ? n2f(ch[0]) * 2 : n2f(ch[arp]);
  osc('square', f, null, t, EIGHTH * 0.6, 0.022, { lp: 1500, dest: D });
  const bp = { 0: 0, 3: 0, 4: 1, 6: 0, 7: 1 }[e];
  if (bp !== undefined) osc('triangle', n2f(BASS[bar][bp]), null, t, EIGHTH * 0.9, 0.2, { dest: D });
  if (e === 0 || e === 4 || (e === 5 && bar % 2)) { osc('sine', 150, 42, t, 0.14, 0.42, { dest: D }); }
  if (e === 2 || e === 6) { nz(t, 0.12, 0.13, 'bandpass', 1900, 1200, 0.8, D); osc('triangle', 210, 140, t, 0.06, 0.08, { dest: D }); }
  nz(t, 0.035, e % 2 ? 0.05 : 0.025, 'highpass', 7500, null, 0.7, D);
}

// ===================================================================
//  Canvas sizing + pre-rendered parallax layers
// ===================================================================
let LS = 1;
const LAY = {};
function resize() {
  const bw = document.body.clientWidth, bh = document.body.clientHeight;
  const sc = Math.max(0.3, Math.min((bw - 32) / W, (bh - 32) / H));
  const cssW = Math.floor(W * sc), cssH = Math.floor(H * sc);
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  S = canvas.width / W;
  buildLayers();
}
function mk(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * LS)); c.height = Math.max(1, Math.ceil(h * LS));
  const g = c.getContext('2d'); g.scale(LS, LS); g.lineJoin = 'round'; g.lineCap = 'round'; fn(g, w, h); return c;
}
const wrapX = (fn, x) => { fn(x); fn(x - W); fn(x + W); };
let STARS = [];
function buildLayers() {
  const nls = Math.min(S, 3);
  if (LAY.built && Math.abs(nls - LS) < 0.01) return;
  LS = nls; LAY.built = true;
  const R = mulberry(1337), ri = (a, b) => Math.floor(a + R() * (b - a + 1)), rf = (a, b) => a + R() * (b - a);

  // Far clouds
  const clouds = []; for (let i = 0; i < 6; i++) clouds.push({ x: i * 107 + rf(0, 50), y: rf(20, 110), s: rf(0.7, 1.3) });
  LAY.clouds = { c: mk(W, 150, g => {
    for (const cl of clouds) wrapX(x => {
      const puffs = [[0, 0, 16], [16, -8, 20], [36, -2, 17], [52, 4, 12], [-14, 5, 11]];
      g.fillStyle = 'rgba(205,215,255,0.85)';
      for (const [dx, dy, r] of puffs) { g.beginPath(); g.arc(x + dx * cl.s, cl.y + 4 + dy * cl.s, r * cl.s, 0, TAU); g.fill(); }
      g.fillStyle = 'rgba(255,255,255,0.95)';
      for (const [dx, dy, r] of puffs) { g.beginPath(); g.arc(x + dx * cl.s, cl.y + dy * cl.s, r * cl.s, 0, TAU); g.fill(); }
    }, cl.x);
  }), y: 22, h: 150, f: 0.06 };

  // Hills (two ridges)
  LAY.hills = { c: mk(W, 150, (g, w, h) => {
    const ridge = (base, amps, col, edge) => {
      g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= W; x += 4) { let y = base; amps.forEach(([k, a, p]) => { y -= Math.sin(x / W * TAU * k + p) * a; }); g.lineTo(x, y); }
      g.lineTo(W, h); g.closePath(); g.fillStyle = col; g.fill();
      g.strokeStyle = edge; g.lineWidth = 2; g.stroke();
    };
    ridge(70, [[2, 18, 0.4], [5, 7, 1.3], [9, 3, 2]], '#a9d6e6', 'rgba(255,255,255,.35)');
    ridge(98, [[3, 12, 2.1], [7, 5, 0.2], [11, 2, 1]], '#93cbb4', 'rgba(255,255,255,.3)');
  }), y: 190, h: 150, f: 0.16 };

  // City with witchy spires (+ separate window-light layer for dusk)
  const blds = []; let bx = 0;
  while (bx < W) { const w = ri(22, 50); blds.push({ x: bx, w, h: ri(46, 128), roof: R(), wins: [] }); bx += w + ri(0, 7); }

  LAY.trees = { c: mk(W, 110, (g, w, h) => {

      } else {

function drawParcel(g, x, y, w, h, hits, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const hw = w / 2, hh = h / 2;
  g.lineJoin = 'round'; g.strokeStyle = INK; g.lineWidth = Math.max(1.1, w / 11);
  if (hits >= 2) rr(g, -hw, -hh, w, h, Math.min(2, w / 8));
  else if (hits === 1) { g.beginPath(); g.moveTo(-hw, -hh); g.lineTo(hw * 0.4, -hh); g.lineTo(hw, -hh * 0.3); g.lineTo(hw, hh); g.lineTo(-hw, hh); g.closePath(); }
  else { g.beginPath(); g.moveTo(-hw, -hh * 0.5); g.lineTo(-hw * 0.25, -hh); g.lineTo(hw * 0.2, -hh * 0.45); g.lineTo(hw, -hh * 0.8); g.lineTo(hw * 0.92, hh); g.lineTo(-hw * 0.95, hh); g.closePath(); }
  g.fillStyle = '#dea063'; g.fill();
  g.save(); g.clip();
  g.fillStyle = 'rgba(140,70,20,.22)'; g.fillRect(hw * 0.4, -hh, w, h);
  g.fillStyle = '#f6e6bd';
  if (hits > 0) g.fillRect(-w * 0.11, -hh, w * 0.22, h);
  else { g.fillRect(-w * 0.11, -hh, w * 0.22, h * 0.32); g.fillRect(-w * 0.13, hh * 0.15, w * 0.22, h); }
  hexPath(g, -hw * 0.55, hh * 0.05, h * 0.2); g.fillStyle = '#7b52d9'; g.fill();
  if (hits <= 3) { g.fillStyle = 'rgba(95,45,10,.35)'; g.beginPath(); g.moveTo(hw, hh * 0.2); g.lineTo(hw * 0.5, hh); g.lineTo(hw, hh); g.fill(); }
  if (hits <= 2) { g.fillStyle = 'rgba(95,45,10,.3)'; g.beginPath(); g.ellipse(-hw * 0.2, -hh * 0.55, w * 0.12, h * 0.1, 0.3, 0, TAU); g.fill(); }
  if (hits <= 1) { g.strokeStyle = 'rgba(70,30,10,.85)'; g.lineWidth = Math.max(0.8, w / 18); g.beginPath(); g.moveTo(-hw * 0.9, hh * 0.6); g.lineTo(-hw * 0.5, hh * 0.15); g.lineTo(-hw * 0.2, hh * 0.55); g.lineTo(hw * 0.15, hh * 0.05); g.stroke(); }
  g.restore();
  g.strokeStyle = INK; g.lineWidth = Math.max(1.1, w / 11); g.stroke();
  if (hits === 1) { g.beginPath(); g.moveTo(hw * 0.4, -hh); g.lineTo(hw, -hh * 0.3); g.lineTo(hw * 0.55, -hh * 0.05); g.closePath(); g.fillStyle = '#f0bd84'; g.fill(); g.stroke(); }
  if (hits === 0) { g.strokeStyle = '#f6e6bd'; g.lineWidth = w * 0.12; g.beginPath(); g.moveTo(-w * 0.02, -hh * 0.75); g.quadraticCurveTo(w * 0.15, -hh * 1.3, w * 0.3, -hh * 1.1); g.stroke(); }
  g.restore();
}

function drawEyes(g, mood, t) {
  const ex = 3.4, ey = -0.4;
  g.fillStyle = INK; g.strokeStyle = INK; g.lineWidth = 1.2; g.lineCap = 'round';
  const dot = (rx, ry, oy = 0) => { g.beginPath(); g.ellipse(ex, ey + oy, rx, ry, 0, 0, TAU); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + 0.5, ey - 0.8 + oy, 0.55, 0, TAU); g.fill(); g.fillStyle = INK; };
  switch (mood) {
    case 'alert': if ((t % 200) < 6) { g.beginPath(); g.moveTo(ex - 1.6, ey); g.lineTo(ex + 1.6, ey); g.stroke(); } else dot(1.5, 2.3); break;
    case 'neutral': if ((t % 170) < 6) { g.beginPath(); g.moveTo(ex - 1.5, ey); g.lineTo(ex + 1.5, ey); g.stroke(); } else dot(1.3, 2.0); break;
    case 'tired': dot(1.3, 1.6, 0.5); g.fillStyle = PW.skin; g.fillRect(ex - 2, ey - 2.6, 4, 2.4); g.beginPath(); g.moveTo(ex - 2, ey - 0.1); g.lineTo(ex + 2, ey + 0.2); g.stroke(); break;
    case 'zonked': g.beginPath(); g.arc(ex, ey - 0.4, 1.6, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); g.globalAlpha *= 0.5; g.beginPath(); g.arc(ex, ey + 1.6, 1.4, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke(); g.globalAlpha *= 2; break;
    case 'asleep': g.beginPath(); g.arc(ex, ey - 0.8, 1.7, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke(); break;
    case 'stunned': g.lineWidth = 1; g.beginPath(); g.moveTo(ex - 1.5, ey - 1.5); g.lineTo(ex + 1.5, ey + 1.5); g.moveTo(ex + 1.5, ey - 1.5); g.lineTo(ex - 1.5, ey + 1.5); g.stroke(); break;
    case 'happy': g.beginPath(); g.arc(ex, ey + 0.9, 1.7, 1.12 * Math.PI, 1.88 * Math.PI); g.stroke(); break;
    case 'grumpy': dot(1.3, 1.7, 0.3); g.lineWidth = 1.3; g.beginPath(); g.moveTo(ex - 2.2, ey - 3.4); g.lineTo(ex + 2, ey - 1.9); g.stroke(); break;
  }
  // mouth
  const mx = 5.2, my = 3.6;
  g.lineWidth = 1;
  switch (mood) {
    case 'happy': g.beginPath(); g.arc(mx - 0.4, my - 0.6, 1.7, 0, Math.PI); g.closePath(); g.fill(); g.fillStyle = '#ff7f96'; g.beginPath(); g.arc(mx - 0.4, my + 0.4, 0.8, 0, Math.PI); g.fill(); break;
    case 'alert': case 'neutral': g.beginPath(); g.arc(mx - 0.6, my - 1, 1.3, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke(); break;
    case 'tired': g.beginPath(); g.moveTo(mx - 1.5, my); g.lineTo(mx + 0.6, my - 0.2); g.stroke(); break;
    case 'zonked': case 'asleep': g.beginPath(); g.arc(mx - 0.5, my, 0.75, 0, TAU); g.stroke(); break;
    case 'stunned': g.beginPath(); g.moveTo(mx - 2, my); g.quadraticCurveTo(mx - 1.2, my - 1, mx - 0.4, my); g.quadraticCurveTo(mx + 0.4, my + 1, mx + 1.2, my); g.stroke(); break;
    case 'grumpy': g.beginPath(); g.arc(mx - 0.6, my + 0.8, 1.3, 1.2 * Math.PI, 1.8 * Math.PI); g.stroke(); break;
  }
}

function drawHead(g, mood, t, p, wind = 1) {
  g.strokeStyle = INK; g.lineWidth = 1.5; g.lineJoin = 'round';
  const w = Math.sin(t * 0.3) * 1.2 * wind;
  // back hair
  g.beginPath(); g.moveTo(-3, -6); g.bezierCurveTo(-11, -7, -12, -1, -15 - w, 3); g.quadraticCurveTo(-11.5, 3.5, -13 - w * 0.6, 8.5); g.quadraticCurveTo(-8, 6.5, -4, 5); g.closePath();
  g.fillStyle = p.hair; g.fill(); g.stroke();
  // head
  g.beginPath(); g.arc(0, 0, 7, 0, TAU); g.fillStyle = p.skin; g.fill(); g.stroke();
  // fringe
  g.beginPath(); g.moveTo(-7, -2.5); g.quadraticCurveTo(-3, -2, -1.2, -4.8); g.quadraticCurveTo(2, -2.2, 7, -2.4); g.quadraticCurveTo(7.4, -6, 4, -7); g.lineTo(-6, -6.5); g.closePath();
  g.fillStyle = p.hair; g.fill(); g.stroke();
  // blush
  g.save(); g.globalAlpha *= 0.55; g.fillStyle = p.blush; g.beginPath(); g.ellipse(3.4, 2.8, 1.8, 1.1, 0, 0, TAU); g.fill(); g.restore();
  drawEyes(g, mood, t);
  // hat
  g.strokeStyle = INK; g.lineWidth = 1.5;
  const flop = Math.sin(t * 0.22) * 1.6 * wind;
  g.beginPath(); g.moveTo(-7.5, -6); g.quadraticCurveTo(-4.5, -15, -5, -18.5); g.quadraticCurveTo(-7.5, -24, -15.5 + flop, -25 + Math.abs(flop) * 0.4);
  g.quadraticCurveTo(-3, -24, 1, -17.5); g.quadraticCurveTo(4, -11, 6.5, -6); g.closePath();
  g.fillStyle = p.hat; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-7.2, -7.6); g.quadraticCurveTo(0, -6.2, 6.4, -8); g.lineTo(5.8, -10.8); g.quadraticCurveTo(0, -9.2, -6.6, -10.5); g.closePath();
  g.fillStyle = p.band; g.fill(); g.lineWidth = 1.1; g.stroke();
  starPath(g, -0.3, -9.1, 1.7, 0.75); g.fillStyle = '#fff6c9'; g.fill();
  g.lineWidth = 1.5;
  g.beginPath(); g.ellipse(-0.5, -5.6, 12.5, 2.8, -0.08, 0, TAU); g.fillStyle = p.hat; g.fill(); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1; g.beginPath(); g.ellipse(-0.5, -6.1, 10, 1.4, -0.08, Math.PI * 1.1, Math.PI * 1.7); g.stroke();
}

function drawWitch(g, x, y, o) {
  const p = o.pal || PW, t = o.t || 0;
  g.save(); g.translate(x, y); if (o.flip) g.scale(-1, 1); g.rotate(o.tilt || 0); g.scale(o.sx || 1, o.sy || 1);
  if (o.alpha != null) g.globalAlpha *= o.alpha;
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = INK; g.lineWidth = 1.6;
  const wind = o.boost ? 1.5 : 1;
  // scarf ribbon
  const n = 6, seg = 3.7 * wind, top = [], bot = [];
  for (let i = 0; i <= n; i++) { const px = -3 - i * seg, wv = Math.sin(t * 0.35 - i * 0.8) * (0.4 + i * 0.55), py = -7 + i * 0.6 + wv, hw = 2.4 - i * 0.16; top.push([px, py - hw]); bot.push([px, py + hw]); }
  g.beginPath(); g.moveTo(top[0][0], top[0][1]); top.forEach(q => g.lineTo(q[0], q[1])); for (let i = bot.length - 1; i >= 0; i--) g.lineTo(bot[i][0], bot[i][1]); g.closePath();
  g.fillStyle = p.scarf; g.fill(); g.stroke();
  // bristles
  g.beginPath(); g.moveTo(-14, 5.5); g.lineTo(-29, 0.5); g.quadraticCurveTo(-35, 9, -29, 18); g.lineTo(-14, 12); g.closePath();
  g.fillStyle = p.bristle; g.fill(); g.stroke();
  g.strokeStyle = p.bristleDark; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-15, 7.5); g.lineTo(-29, 4); g.moveTo(-15, 9); g.lineTo(-31, 9.5); g.moveTo(-15, 10.5); g.lineTo(-29, 15); g.stroke();
  // handle
  g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-14, 8.7); g.lineTo(25, 6); g.stroke();
  g.strokeStyle = p.handle; g.lineWidth = 2.6; g.stroke();
  g.strokeStyle = INK; g.lineWidth = 1.6;
  rr(g, -16.5, 4.5, 4, 9, 1.5); g.fillStyle = p.broomBand; g.fill(); g.stroke();
  // parcel strapped to the broom
  const cs = o.carryScale ?? 1;
  if (o.carry != null && o.carry >= 0 && cs > 0.02) { g.save(); g.translate(-7.5, 3 + (o.carryShake || 0)); g.scale(cs, cs); drawParcel(g, 0, 0, 12, 10, o.carry); g.restore(); g.strokeStyle = INK; g.lineWidth = 1.6; }
  // dress
  const fl = Math.sin(t * 0.4) * 1.3 * wind;
  g.beginPath(); g.moveTo(-4.5, -8); g.quadraticCurveTo(-8, 0, -11 - fl, 9.5); g.lineTo(-6, 8); g.lineTo(-3, 10.5); g.lineTo(10, 9.5); g.quadraticCurveTo(8.5, 0, 5, -8); g.closePath();
  g.fillStyle = p.dress; g.fill();
  g.save(); g.clip(); g.fillStyle = p.dressDark; g.fillRect(-14, 4, 30, 8); g.restore();
  g.stroke();
  // leg + boot
  g.lineWidth = 4.2; g.beginPath(); g.moveTo(5, 8); g.lineTo(9, 14.5); g.stroke();
  g.lineWidth = 2.6; g.strokeStyle = p.sock; g.stroke(); g.strokeStyle = INK; g.lineWidth = 1.6;
  g.beginPath(); g.ellipse(10.8, 15.2, 3.6, 2.2, 0.2, 0, TAU); g.fillStyle = p.boot; g.fill(); g.stroke();
  // arm
  g.lineWidth = 4.6; g.beginPath(); g.moveTo(2.5, -4); g.quadraticCurveTo(8, -1, 13, 5); g.stroke();
  g.lineWidth = 3; g.strokeStyle = p.dress; g.stroke(); g.strokeStyle = INK; g.lineWidth = 1.6;
  g.beginPath(); g.arc(13.3, 5.6, 2.3, 0, TAU); g.fillStyle = p.skin; g.fill(); g.stroke();
  // head
  g.save(); g.translate(2, -14); drawHead(g, o.mood || 'neutral', t, p, wind); g.restore();
  g.restore();
}

function drawCat(g, x, y, t) {
  g.save(); g.translate(x, y); g.scale(-1, 1); g.strokeStyle = INK; g.lineWidth = 1.6; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-14, 5.5); g.lineTo(-29, 0.5); g.quadraticCurveTo(-35, 9, -29, 18); g.lineTo(-14, 12); g.closePath(); g.fillStyle = PW.bristle; g.fill(); g.stroke();
  g.lineWidth = 5; g.beginPath(); g.moveTo(-14, 8.7); g.lineTo(25, 6); g.stroke(); g.strokeStyle = PW.handle; g.lineWidth = 2.6; g.stroke(); g.strokeStyle = INK; g.lineWidth = 1.6;
  const tw = Math.sin(t * 0.2) * 3;
  g.lineWidth = 3.5; g.beginPath(); g.moveTo(-6, 2); g.quadraticCurveTo(-16, -6 + tw, -12, -14); g.stroke(); g.lineWidth = 1.6;

  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fillStyle = '#ffcf3f'; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.3; g.stroke();
  g.beginPath(); g.arc(0, 0, r * 0.6, 0, TAU); g.strokeStyle = '#e09a1f'; g.lineWidth = 1; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(-r * 0.35, -r * 0.35, r * 0.25, 0, TAU); g.fill();
  g.restore();
}

function addStamp(x, stars, label, pay) { STAMPS.push({ x: clamp(x, 90, W - 90), y: FLOOR - 78, stars, label, pay, t: 0 }); }
function updStamps() {
  for (const s of STAMPS) {
    s.t++;
    for (let i = 0; i < 5; i++) if (s.t === 14 + i * 6 && i < s.stars) sfx('star', i);
  }
  STAMPS = STAMPS.filter(s => s.t < 125);
}
function drawStamps() {
  for (const s of STAMPS) {
    const g = X, out = s.t > 100 ? (s.t - 100) / 25 : 0, inn = easeOutBack(clamp(s.t / 12, 0, 1));
    g.save(); g.globalAlpha = 1 - out; g.translate(s.x, s.y - out * 18); g.scale(inn, inn);
    const col = s.stars >= 5 ? '#ffd84d' : s.stars >= 4 ? '#7ee081' : s.stars >= 2 ? '#f3ecff' : '#ff8f8f';
    text(g, s.label, 0, -22, { size: s.stars >= 5 ? 19 : 16, font: FONT_D, color: col, align: 'center', stroke: INK, sw: 5, shadow: 'rgba(42,29,63,.5)' });
    for (let i = 0; i < 5; i++) {
      const sx = (i - 2) * 15, on = i < s.stars && s.t >= 14 + i * 6;
      const k = on ? easeOutBack(clamp((s.t - 14 - i * 6) / 8, 0, 1)) : 1;
      g.save(); g.translate(sx, 0); g.scale(k, k);
      starPath(g, 0, 0, 7, 3.2); g.fillStyle = on ? '#ffd84d' : 'rgba(42,29,63,.55)'; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.8; g.stroke();
      g.restore();
    }
    if (s.pay > 0 && s.t > 40) text(g, '+$' + s.pay, 0, 20, { size: 15, font: FONT_D, color: '#ffe27a', align: 'center', stroke: INK, sw: 4 });
    g.restore();
  }
}

// ---------- effects
function shake(a) { G.trauma = Math.min(1, G.trauma + (REDUCED ? a * 0.3 : a)); }
function emitDust(x, y, n, col = '#f3ecff') { burst(n, () => ({ type: 'dust', x: x + rand(-6, 6), y: y - rand(0, 3), vx: rand(-1.5, 1.5), vy: rand(-1.4, -0.2), drag: 0.92, life: irand(18, 30), size: rand(2, 4), color: col, ws: true })); }

function getHit(e) {
  const before = G.parcel.hits;
  sfx(before === 1 ? 'fragile' : 'impact');
  if (e.kind === 'ghost') sfx('boo'); else if (e.kind === 'bird') sfx('caw');
  G.parcel.hits = Math.max(0, before - 1);
  G.stamina = Math.max(0, G.stamina - 5);
  G.parcelShake = 18;
  if (P.vy < 0) P.vy = 0;
  P.stunT = 18; P.iT = 60;
  if (e.kind === 'car') P.vy = -6;
  if (e.kind === 'witch') P.vy = 1.75;
  shake(0.6); G.freeze = 5; G.hurt = 1; P.sq = -0.25;
  burst(9, () => ({ type: 'debris', x: P.x - 8, y: P.y + 2, vx: rand(-3, 1.5), vy: rand(-4, -1), g: 0.22, life: irand(30, 50), size: rand(2.5, 4.5), color: choose(['#dea063', '#f6e6bd', '#c4854a']), vr: rand(-0.3, 0.3), ws: true }));
  burst(6, () => ({ type: 'star', x: P.x + rand(-6, 6), y: P.y + rand(-10, 4), vx: rand(-2.5, 2.5), vy: rand(-2.5, 1), drag: 0.9, life: 22, size: 4, color: '#fff' }));
  part({ type: 'ring', x: P.x, y: P.y, size: 6, grow: 26, life: 16, color: '#fff' });
  if (e.kind === 'bird') burst(5, () => ({ type: 'feather', x: P.x + 10, y: P.y, vx: rand(-1, 2), vy: rand(-1.5, 0.5), g: 0.03, life: 60, size: 3, color: '#505f98', vr: rand(-0.1, 0.1), ws: true }));
  if (e.kind === 'bramble') burst(4, () => ({ type: 'leaf', x: P.x + 6, y: P.y, vx: rand(-1, 1.5), vy: rand(-1.5, 0.5), g: 0.05, life: 50, size: 3, color: '#6cc46a', vr: rand(-0.15, 0.15), ws: true }));
  ftext(HIT_WORDS[e.kind] || 'BONK!', P.x + 8, P.y - 34, { size: 17, color: '#fff', life: 42 });
}

function tryDrop() {
  const h = currentHouse();
  if (!h || h.delivered) { if (!h) { sfx('nope'); P.noDrop = 14; } return; }
  spawn('parcel', { x: P.x, y: P.y + 8, vy: 0, hits: G.parcel.hits, high: P.y < 179, house: h, rot: 0, spin: rand(-0.06, 0.06), sq: 0, landed: false });
  h.delivered = true;
  G.housesPassed++;
  G.parcel = { hits: 4 };
  P.carryPop = 0; P.carryDelay = 26;
  sfx('whoosh');
  burst(5, () => ({ type: 'star', x: P.x - 8, y: P.y + 6, vx: rand(-1, 1), vy: rand(0, 1.5), drag: 0.95, life: 24, size: 3, color: choose(SPARK_COLS), ws: true }));
}

function distTier(e, h) {
  const l = e.x - 9, r = e.x + 9, pl = h.x + 68, pr = h.x + 92, hl = h.x, hr = h.x + 178;
  if (l >= pl && r <= pr) return { m: 1.5, label: 'Perfect porch!' };
  if (l < pr && r > pl) return { m: 1.0, label: 'On the porch' };
  if (l >= hl && r <= hr) return { m: 0.5, label: 'Front yard' };
  if (l < hr && r > hl) return { m: 0.25, label: 'Close-ish' };
  return { m: 0, label: 'Missed!' };
}
const hitMult = h => [0, 0.25, 0.5, 0.75, 1][clamp(h, 0, 4)];
function multToStars(m) { if (m >= 1.3) return 5; if (m >= 1) return 4; if (m >= 0.5) return 3; if (m >= 0.25) return 2; if (m > 0) return 1; return 0; }

function parcelLand(e) {
  e.rot = 0; e.sq = 1;
  emitDust(e.x, FLOOR, 7);
  if (e.high) {
    sfx(e.hits === 1 ? 'fragile' : 'impact');
    e.hits = Math.max(0, e.hits - 1);
    ftext('Dropped from too high!', e.x, FLOOR - 30, { size: 11, color: '#ffb3b3', life: 55, font: FONT_UI });
    burst(6, () => ({ type: 'debris', x: e.x, y: FLOOR - 6, vx: rand(-2.5, 2.5), vy: rand(-3.5, -1), g: 0.22, life: 36, size: rand(2, 3.5), color: choose(['#dea063', '#f6e6bd']), vr: rand(-0.3, 0.3), ws: true }));
    shake(0.2);
  } else sfx('thud');
  const h = e.house && !e.house.dead ? e.house : null;
  const d = h ? distTier(e, h) : { m: 0, label: 'Missed!' };
  if (h && d.m > 0) {
    const total = hitMult(e.hits) * d.m, stars = multToStars(total);
    registerRating(stars);
    const pay = registerDelivery(total, e.x, FLOOR - 10);
    h.success = true; h.stars = stars;
    sfx('cash');
    part({ type: 'ring', x: e.x, y: FLOOR - 6, size: 4, grow: 30, life: 18, color: '#ffe27a', ws: true });
    if (total >= 1) {
      sfx('ding');
      for (const dir of [-1, 1]) burst(6, () => ({ type: 'star', x: e.x, y: FLOOR - 10, vx: dir * rand(0.8, 3), vy: rand(-3.5, -1.5), g: 0.1, life: irand(18, 30), size: 4, color: choose(SPARK_COLS), ws: true }));
      P.happy = 70;
      burst(4, i => ({ type: 'heart', x: h.x + 80 + rand(-10, 10), y: FLOOR - 50, vx: rand(-0.4, 0.4), vy: rand(-1.2, -0.6), life: 60 + i * 8, size: rand(3, 4.5), color: '#ff6f91', ws: true }));
    }
    if (d.m > 1) {
      G.stamina = Math.min(100, G.stamina + 15);
      sfx('restore');
      G.flash = 0.35; shake(0.15);
      burst(40, () => ({ type: 'confetti', x: e.x + rand(-10, 10), y: FLOOR - 12, vx: rand(-4, 4), vy: rand(-7, -3), g: 0.18, drag: 0.98, life: irand(50, 80), size: rand(3, 5), color: choose(CONFETTI), vr: rand(-0.3, 0.3), ws: true }));
      ftext('+15 energy', P.x, P.y - 40, { size: 13, color: '#7fe3ff', life: 60 });
    }
    addStamp(e.x, stars, d.label, pay);
    if (G.streak >= 2) ftext(`Streak x${G.streak}`, clamp(e.x, 90, W - 90), FLOOR - 128, { size: 14, color: '#ffb84d', life: 60 });
  } else {
    if (h) registerRating(0);
    G.streak = 0;
    sfx('place'); sfx('miss');
    addStamp(e.x, 0, 'Missed!', 0);
  }
}

// ---------- flow
function startRoute() {
  if (!G || G.state !== 'pending') return;
  G.state = 'active';
  G.managers = G.conditions.map(makeManager);
  sfx('go'); musicStop(); musicStart(); musicLevel(0.5, 0.05);
  showBanner('Off we go!');
}
function showBanner(kicker) {
  const main = COND[G.conditions[0]].name, extra = G.conditions[1] ? COND[G.conditions[1]].name : null;
  G.banner = { kicker, main, extra, t: 0 };
}
function endRoute() {
  G.state = 'finished'; G.managers = []; G.endT = 0;
  G.earned = G.pay + G.tips;
  musicLevel(0.22, 1.2); sfx('sleep'); sfx('yawn');
  ftext('Out of energy\u2026', P.x, P.y - 40, { size: 15, color: '#f3ecff', life: 90 });
  BEST.total = (BEST.total || 0) + G.earned;
  if (G.earned > BEST.money) { BEST.money = G.earned; G.newBest = G.earned > 0; }
  BEST.streak = Math.max(BEST.streak, G.bestStreak);
  saveBest();
}

// ===================================================================
//  Update
// ===================================================================
function update() {
  FT++;
  if (TR.active) updTransition();
  if (scene === 'menu') { updateMenu(); return; }
  updateRun();
}

const MW = { y: 200, vy: 0, tilt: 0 };
function updateMenu() {
  worldDist += 2.5;
  const ty = 205 + Math.sin(FT * 0.03) * 34;
  MW.vy = ty - MW.y; MW.y = ty;
  MW.tilt = lerp(MW.tilt, clamp(MW.vy * 0.25, -0.3, 0.3), 0.1);
  if (FT % 4 === 0) part({ type: 'star', x: 138 - 50, y: MW.y + 15, vx: rand(-0.4, 0.2), vy: rand(-0.3, 0.3), life: 55, size: rand(2.5, 4), color: choose(SPARK_COLS), back: true, ws: true });
  updParts(2.5); updTexts();
}

function updateRun() {
  if (G.paused) { setWind(false, 900); return; }
  G.t++;
  // timers that run even during hit-stop
  G.trauma = Math.max(0, G.trauma - 0.025);
  G.hurt = Math.max(0, G.hurt - 0.05); G.flash = Math.max(0, G.flash - 0.03);
  if (G.freeze > 0) { G.freeze--; return; }

  const st = G.state;
  if (st === 'finished') G.speed = lerp(G.speed, 0, 0.025);
  const sp = G.speed;
  worldDist += sp;

  if (st === 'active') {
    G.secT -= sp;
    G.stamina -= 0.0075;
    if (G.stamina <= 33 && !G.firstCoffee) { G.firstCoffee = true; G.firstCoffeeT = 300; }
    if (G.firstCoffeeT > 0 && --G.firstCoffeeT === 0 && !G.ents.some(e => e.kind === 'coffee')) { spawnCoffee(); G.coffeeCD = 300; }
    G.obsCD = Math.max(0, G.obsCD - 1); G.coffeeCD = Math.max(0, G.coffeeCD - 1);
    while (G.secT <= 0) {
      G.managers = [];
      spawnHouse();
      G.conditions = rollSection();
      G.managers = G.conditions.map(makeManager);
      G.secT += 3200;
      showBanner(`Parcel for No. ${currentHouse().num}`);
    }
    if (G.coffeeCD === 0 && G.stamina <= 66 && Math.random() < 0.0005 && !G.ents.some(e => e.kind === 'coffee')) { spawnCoffee(); G.coffeeCD = 300; }
    if (G.section > 0 && G.obsCD === 0 && !G.ents.some(e => e.kind === 'car' || e.kind === 'witch') && Math.random() < 0.001) {
      spawnTraffic(P.y < H / 2 ? 'witch' : 'car'); G.obsCD = 900;
    }
    for (const m of G.managers) updManager(m);
    if (G.stamina <= 0) { G.stamina = 0; endRoute(); }
  }
  if (st === 'finished') {
    G.endT++;
    if (G.endT === 70) G.results = true;
    if (G.endT % 45 === 0) part({ type: 'z', x: P.x + 8, y: P.y - 22, vx: 0.4, vy: -0.6, life: 70, size: 11 });
  }
  if (G.results) {
    G.resT++; G.resY = lerp(G.resY, 182, 0.12);
    if (G.earned > 0 && G.resT > 10 && G.resT < 70 && G.resT % 3 === 0) sfx('tick', G.resT / 2);
    if (G.resT === 72 && G.earned > 0) sfx('cash');
  }

  // world entities
  for (const e of G.ents) {
    switch (e.kind) {
      case 'house':
        e.x -= sp;
        if (e.success) e.open = Math.min(1, e.open + 0.05);
        if (++e.smokeT % 16 === 0) part({ type: 'smoke', x: e.x + 136, y: FLOOR - 182, vx: rand(-0.6, -0.2), vy: rand(-0.8, -0.4), life: 70, size: rand(3, 5), color: '#f3ecff', ws: true, back: true });
        break;
      case 'bramble': case 'sword': e.x -= sp; break;
      case 'mush': e.x -= sp; e.squish *= 0.86; break;
      case 'bird': e.x -= sp + 5; break;
      case 'ghost': e.x -= sp; e.y -= e.rise; if (FT % 6 === 0) part({ type: 'dust', x: e.x + 16, y: e.y + 28, vx: 0, vy: 0.3, life: 20, size: 2, color: '#e9e4ff', ws: true, back: true, alpha: 0.6 }); break;
      case 'car': e.x -= sp + e.extra; e.rot -= (sp + e.extra) / 6; if (FT % 8 === 0) part({ type: 'smoke', x: e.x + 60, y: FLOOR - 9, vx: rand(0.5, 1), vy: rand(-0.5, -0.2), life: 30, size: 2.5, color: '#d7d0e6', back: true }); break;
      case 'witch': e.x -= sp + e.extra; if (FT % 5 === 0) part({ type: 'star', x: e.x + 44, y: e.y + 26, vx: 0, vy: rand(-0.3, 0.3), life: 30, size: 2.5, color: e.pal.scarf, back: true, ws: true }); break;
      case 'coffee':
        e.x -= sp - 2.5; e.y = e.y0 + Math.sin(G.t * 0.0582) * 32;
        if (FT % 10 === 0) part({ type: 'star', x: e.x + 12 + rand(-12, 12), y: e.y + rand(-12, 12), vy: -0.3, life: 26, size: 2.5, color: '#ffe27a' });
        break;
      case 'parcel':
        e.x -= sp;
        if (!e.landed) {
          e.vy += 0.26; e.rot += e.spin;
          if (e.y + 7 + e.vy >= FLOOR) { e.y = FLOOR - 7; e.vy = 0; e.landed = true; parcelLand(e); }
          else e.y += e.vy;
        }
        e.sq *= 0.84;
        break;
    }
    if (e.x + (RIGHT[e.kind] || 64) < 0 || (e.kind === 'ghost' && e.y < -40)) {
      e.dead = true;
      if (e.kind === 'house' && !e.success && !e.delivered && G.state === 'active') {
        G.streak = 0; registerRating(0); sfx('miss');
        ftext(`Missed No. ${e.num}!`, 120, 110, { size: 15, color: '#ff8f8f', life: 70 });
      }
    }
  }
  G.ents = G.ents.filter(e => !e.dead);

  updatePlayer();

  // coffee pickup
  if (st === 'active') {
    const pb = pBox(P.y);
    for (const e of G.ents) if (e.kind === 'coffee' && !e.dead && rectHit(pb, eRect(e))) {
      e.dead = true;
      G.stamina = Math.min(100, G.stamina + 15);
      sfx('restore'); P.happy = 50;
      part({ type: 'ring', x: e.x + 12, y: e.y, size: 6, grow: 34, life: 20, color: '#ffe27a' });
      burst(14, () => ({ type: 'star', x: e.x + 12, y: e.y, vx: rand(-3, 3), vy: rand(-3, 3), drag: 0.9, life: irand(20, 34), size: rand(3, 5), color: choose(['#ffe27a', '#fff', '#ffb84d']) }));
      ftext('Potion of Caffeine! +15', P.x + 10, P.y - 38, { size: 13, color: '#ffe27a', life: 70 });
    }
    G.ents = G.ents.filter(e => !e.dead);
  }

  // yawn when energy dips below a third
  if (P.lastStamina >= 33 && G.stamina < 33 && st === 'active') { sfx('yawn'); ftext('*yaaawn*', P.x + 6, P.y - 36, { size: 13, color: '#e9e4ff', life: 70, font: FONT_UI }); }
  P.lastStamina = G.stamina;
  if (st === 'active' && G.stamina < 10 && FT % 50 === 0) part({ type: 'z', x: P.x + 8, y: P.y - 24, vx: 0.4, vy: -0.6, life: 60, size: 9 });

  // HUD tweens
  G.disp = lerp(G.disp, G.stamina, 0.1);
  if (G.stamina < G.trail) { if (G.trailHold > 0) G.trailHold--; else G.trail = Math.max(G.stamina, G.trail - 0.6); } else G.trail = G.stamina;
  if (G.stamina < G.disp - 2) G.trailHold = 25;
  if (st !== 'pending') G.badge = lerp(G.badge, 0, 0.08); else G.badge = -240;
  G.coinBump *= 0.85; G.rateBump *= 0.9; G.delBump *= 0.88; G.streakBump *= 0.9;
  if (G.parcelShake > 0) G.parcelShake--;
  if (G.banner) G.banner.t++;
  if (G.banner && G.banner.t > 230) G.banner = null;

  if (G.shown < G.target) {
    G.shown = Math.min(G.target, G.shown + Math.max(1, Math.ceil((G.target - G.shown) / 25)));
    if (G.t % 3 === 0) sfx('tick', G.tickN++);
  } else G.tickN = 0;

  updCoins(); updStamps(); updParts(sp); updTexts();
}

function spawnCoffee() { const y0 = irand(51, 307); spawn('coffee', { y: y0, y0 }); G.firstCoffee = true; }

function updatePlayer() {
  const st = G.state;
  if (P.stunT > 0) P.stunT--;
  if (P.iT > 0) P.iT--;
  if (P.happy > 0) P.happy--;
  if (P.noDrop > 0) P.noDrop--;
  if (P.carryDelay > 0 && --P.carryDelay === 0) { sfx('pop'); burst(6, () => ({ type: 'star', x: P.x - 8, y: P.y + 2, vx: rand(-1.5, 1.5), vy: rand(-1.5, 1.5), drag: 0.9, life: 18, size: 3, color: '#fff' })); }
  if (P.carryDelay === 0) P.carryPop = Math.min(1, P.carryPop + 0.12);
  P.sq *= 0.8;

  if (st === 'pending') {
    const ty = 170 + Math.sin(G.t * 0.05) * 10;
    P.vy = ty - P.y; P.y = ty; P.boost = false;
    P.tilt = lerp(P.tilt, clamp(P.vy * 0.2, -0.2, 0.2), 0.1);
    if (FT % 5 === 0) part({ type: 'star', x: P.x - 30, y: P.y + 9, vy: rand(-0.3, 0.3), life: 50, size: rand(2.5, 3.5), color: choose(SPARK_COLS), back: true, ws: true });
    setWind(false, 900);
    return;
  }

  P.boost = st === 'active' && boostHeld() && P.stunT <= 0;
  if (st === 'active' && dropQ) tryDrop();
  dropQ = false;

  const mod = staminaMod();
  if (P.boost) P.vy -= GRAV * mod; else P.vy += GRAV * (2 - mod);
  P.vy = clamp(P.vy, -10, 10);

  const cur = pBox(P.y);
  let hitE = null, solidOverlap = false;
  for (const e of G.ents) {
    const k = e.kind;
    if (k === 'mush' || k === 'bramble') { if (rectHit(cur, eRect(e))) { solidOverlap = true; hitE = hitE || e; } }
    else if (k === 'sword') { if (swordHit(e, cur)) hitE = hitE || e; }
    else if (KILL[k]) { if (rectHit(cur, eRect(e))) hitE = e; }
  }
  if (!solidOverlap && P.vy !== 0) {
    const nb = pBox(P.y + P.vy);
    for (const e of G.ents) {
      if (e.kind !== 'mush' && e.kind !== 'bramble') continue;
      const r = eRect(e);
      if (rectHit(nb, r)) {
        if (P.vy > 0) { P.y = r.t - HH - 0.01; if (e.kind === 'bramble' && P.vy > 2) emitDust(P.x, r.t, 3, '#9fdc8f'); }
        else { P.y = r.b + HH + 0.01; if (P.vy < -2) { sfx('thud'); P.sq = -0.15; } }
        P.vy = 0; break;
      }
    }
  }
  if (P.y + P.vy + HH > FLOOR) {
    const v = P.vy; P.y = FLOOR - HH; P.vy = 0;
    if (v > 2.5) { emitDust(P.x, FLOOR, 8); sfx('thud'); P.sq = 0.25; shake(0.12); }
  }
  if (P.y + P.vy - HH < CEIL) {
    const v = P.vy; P.y = CEIL + HH; P.vy = 0;
    if (v < -2.5) { burst(6, () => ({ type: 'dust', x: P.x + rand(-8, 8), y: CEIL + 4, vx: rand(-1, 1), vy: rand(0.2, 1), drag: 0.92, life: 24, size: 3, color: '#fff', ws: true })); P.sq = -0.18; }
  }
  P.grounded = P.y + HH >= FLOOR - 0.5;

  if (hitE && st === 'active') { if (!P.colliding && P.iT <= 0) getHit(hitE); P.colliding = true; }
  else P.colliding = false;

  if (!P.colliding && st === 'active') {
    const fb = pBox(P.y + 1);
    for (const e of G.ents) {
      if (e.kind !== 'mush') continue;
      const r = eRect(e);
      if (rectHit(fb, r) && P.y + HH <= r.t + 1.5) {
        P.vy = -5; e.squish = 1; P.sq = -0.3; sfx('boing');

function drawMusicIcon(g) { g.fillStyle = INK; g.strokeStyle = INK; g.lineWidth = 1.8; g.beginPath(); g.ellipse(-3, 4, 3, 2.3, -0.3, 0, TAU); g.fill(); g.beginPath(); g.moveTo(-0.3, 4); g.lineTo(-0.3, -6); g.quadraticCurveTo(3, -4, 5, -1); g.stroke(); }
function drawSfxIcon(g) { g.fillStyle = INK; g.beginPath(); g.moveTo(-7, -2.5); g.lineTo(-4, -2.5); g.lineTo(0, -6); g.lineTo(0, 6); g.lineTo(-4, 2.5); g.lineTo(-7, 2.5); g.closePath(); g.fill(); g.strokeStyle = INK; g.lineWidth = 1.6; g.lineCap = 'round'; g.beginPath(); g.arc(1, 0, 3.5, -0.9, 0.9); g.stroke(); g.beginPath(); g.arc(1, 0, 6.5, -0.9, 0.9); g.stroke(); }
function keycap(g, label, x, y, w = 0) {
  g.font = `900 9px ${FONT_UI}`; const tw = Math.max(w, g.measureText(label).width + 10);
  rr(g, x, y - 7, tw, 15, 4); g.fillStyle = INK; g.fill();
  rr(g, x, y - 8.5, tw, 15, 4); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = INK; g.lineWidth = 1.4; g.stroke();
  text(g, label, x + tw / 2, y - 0.5, { size: 9, color: INK, align: 'center', weight: 900 });
  return tw;
}
function panel(g, x, y, w, h) {
  rr(g, x, y + 5, w, h, 18); g.fillStyle = 'rgba(42,29,63,.45)'; g.fill();
  rr(g, x, y, w, h, 18); g.fillStyle = '#fff7e8'; g.fill(); g.strokeStyle = INK; g.lineWidth = 3; g.stroke();
  rr(g, x + 5, y + 5, w - 10, h - 10, 14); g.strokeStyle = 'rgba(123,82,217,.25)'; g.lineWidth = 1.5; g.setLineDash([4, 4]); g.stroke(); g.setLineDash([]);
}

  btn('again', W / 2 - 72, y + h - 30, 128, 32, 'Fly again', restartRun, { primary: true, size: 14 });
  btn('menu', W / 2 + 72, y + h - 30, 128, 32, 'Menu', toMenu, { size: 14 });
}

function drawPause() {
  const g = X;

// ---------- Menu
function renderMenu() {
  const tod = todNow();

  X.drawImage(LAY.ceiling.c, -(Math.round((((worldDist % W) + W) % W) * S) / S), 0, W, 34);

  drawParts(true);
  drawWitch(X, 138, MW.y, { t: FT, tilt: MW.tilt, mood: 'alert', boost: true, carry: 4, sx: 1.6, sy: 1.6 });
  drawParts(false);
  drawTexts();

  // logo
  const g = X, lx = 404, ly = 92;
  g.save(); g.translate(lx, ly); g.rotate(-0.04 + Math.sin(FT * 0.025) * 0.015);
  const word = 'Hexpress';
  g.font = `400 58px ${FONT_D}`;
  const widths = [...word].map(ch => g.measureText(ch).width), total = widths.reduce((a, b) => a + b, 0);
  let cx = -total / 2;
  [...word].forEach((ch, i) => {
    const yo = Math.sin(FT * 0.08 - i * 0.55) * 3.5;
    const lg = g.createLinearGradient(0, -30, 0, 22); lg.addColorStop(0, '#ffe58a'); lg.addColorStop(0.55, '#ffb84d'); lg.addColorStop(1, '#ff6f91');
    g.save(); g.translate(cx + widths[i] / 2, yo);

  // ribbon
  g.save(); g.translate(18, 42); g.rotate(0.03);

  g.fillStyle = '#7b52d9'; g.fill(); g.strokeStyle = INK; g.lineWidth = 3; g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.setLineDash([3, 3]); g.lineWidth = 1.2; g.beginPath(); g.moveTo(-94, -8); g.lineTo(94, -8); g.moveTo(-94, 8); g.lineTo(94, 8); g.stroke(); g.setLineDash([]);
  text(g, 'D E L I V E R Y', 0, 1.5, { size: 16, font: FONT_D, color: '#fff7e8', align: 'center' });

  // parcel badge
  g.save(); g.translate(-total / 2 - 14, -22); g.rotate(-0.3 + Math.sin(FT * 0.06) * 0.08); drawParcel(g, 0, 0, 30, 24, 4); g.restore();
  g.restore();

  btn('start', lx + 18, 196, 190, 42, 'Start route', toRun, { primary: true, size: 18 });
  text(X, BEST.money > 0 ? `Best $${BEST.money} \u00b7 best streak ${BEST.streak} \u00b7 lifetime $${BEST.total}` : 'Willow has parcels to deliver before bedtime.', lx + 18, 236, { size: 11, color: '#fff', align: 'center', stroke: INK, sw: 3.5 });

  // controls strip
  const cy = 300;
  rr(X, 262, cy - 16, 316, 32, 16); X.fillStyle = 'rgba(42,29,63,.55)'; X.fill();
  let kx = 276;
  kx += keycap(X, 'Space', kx, cy) + 4; text(X, 'fly', kx, cy, { size: 10.5, color: '#fff' }); kx += 24;
  kx += keycap(X, '\u2193', kx, cy) + 4; text(X, 'drop', kx, cy, { size: 10.5, color: '#fff' }); kx += 32;
  kx += keycap(X, 'Esc', kx, cy) + 4; text(X, 'pause', kx, cy, { size: 10.5, color: '#fff' }); kx += 40;
  kx += keycap(X, 'M', kx, cy) + 4; text(X, 'music', kx, cy, { size: 10.5, color: '#fff' });

  iconBtn('music', W - 26, 24, 13, drawMusicIcon, toggleMusic, !AU.musicOn);
  iconBtn('sfx', W - 56, 24, 13, drawSfxIcon, toggleSfx, !AU.sfxOn);
  if (DEBUG) text(X, 'Debug mode!', 16, 22, { size: 12, color: '#ff8fd8', stroke: INK, sw: 3 });
  const portrait = canvas.clientHeight > canvas.clientWidth * 0.9 || (touchUI && window.innerHeight > window.innerWidth);
  if (portrait) text(X, 'Turn your phone sideways for a bigger view', W / 2, H - 14, { size: 11, color: '#fff', align: 'center', stroke: INK, sw: 3 });
}

// ---------- Transitions (iris wipe)
const TR = { active: false, t: 0, phase: 0, cb: null, cx: W / 2, cy: H / 2 };
function transition(cb, cx = W / 2, cy = H / 2) { if (TR.active) return; Object.assign(TR, { active: true, t: 0, phase: 0, cb, cx, cy }); sfx('whoosh'); }
function updTransition() {
  TR.t++;
  if (TR.phase === 0 && TR.t >= 22) { TR.phase = 1; TR.t = 0; TR.cb && TR.cb(); }
  else if (TR.phase === 1 && TR.t >= 26) TR.active = false;
}
function drawTransition() {
  const maxR = 760;
  const u = TR.phase === 0 ? easeInOut(TR.t / 22) : 1 - easeInOut(TR.t / 26);
  const r = maxR * (1 - u);
  X.save(); X.beginPath(); X.rect(0, 0, W, H); X.arc(TR.cx, TR.cy, Math.max(0.1, r), 0, TAU, true); X.fillStyle = '#1c1433'; X.fill('evenodd');
  if (r > 1) { X.beginPath(); X.arc(TR.cx, TR.cy, r, 0, TAU); X.strokeStyle = '#ffd04d'; X.lineWidth = 4; X.stroke(); }
  X.restore();
}

function toRun() { transition(() => { scene = 'run'; newRun(); musicStop(); }, 138, MW.y); }
function restartRun() { transition(() => { newRun(); musicStop(); }, P.x, P.y); }
function toMenu() { transition(() => { scene = 'menu'; G = null; musicStop(); PARTS = []; TEXTS = []; COINS = []; STAMPS = []; setWind(false, 900); }, scene === 'run' ? P.x : W / 2, scene === 'run' ? P.y : H / 2); }
function togglePause() {
  if (!G || G.state === 'finished') return;
  G.paused = !G.paused;
  sfx('press');
  musicLevel(G.paused ? 0.12 : 0.5, 0.15);
}
function toggleMusic() { audioInit(); AU.musicOn = !AU.musicOn; saveAudio(); if (AU.ctx) AU.mus.gain.setTargetAtTime(AU.musicOn ? (G && G.paused ? 0.12 : G && G.state === 'finished' ? 0.22 : 0.5) : 0, AU.ctx.currentTime, 0.05); sfx('press'); }
function toggleSfx() { audioInit(); AU.sfxOn = !AU.sfxOn; saveAudio(); if (AU.ctx) AU.sfx.gain.setTargetAtTime(AU.sfxOn ? 0.9 : 0, AU.ctx.currentTime, 0.05); sfx('press'); }

// ===================================================================
//  Events
// ===================================================================
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function hitButton(p) { for (let i = UI.btns.length - 1; i >= 0; i--) { const b = UI.btns[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b; } return null; }
function pressButton(b) { UI.pressId = b.id; UI.pressT = 8; if (b.id !== 'drop') sfx('press'); b.cb && b.cb(); }

canvas.addEventListener('pointerdown', e => {
  audioInit(); canvas.focus({ preventScroll: true });
  if (e.pointerType === 'touch') touchUI = true;
  const p = toLogical(e);
  if (TR.active) return;
  const b = hitButton(p);
  if (b) { e.preventDefault(); pressButton(b); return; }
  if (scene !== 'run' || G.paused || G.results) return;
  if (e.button === 2) { if (G.state === 'active') dropQ = true; e.preventDefault(); return; }
  if (e.button === 0) {
    if (G.state === 'pending') startRoute();
    pointers.add(e.pointerId);
  }
});
const releasePointer = e => pointers.delete(e.pointerId);
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  mouse = toLogical(e);
  const b = hitButton(mouse), id = b ? b.id : null;
  if (id && id !== UI.hover && id !== 'drop') sfx('hover');
  UI.hover = id;
});
canvas.addEventListener('pointerleave', () => { UI.hover = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
let konamiI = 0;
window.addEventListener('keydown', e => {
  audioInit();
  const c = e.code;
  if (BOOST_KEYS.has(c) || DROP_KEYS.has(c) || c === 'ArrowLeft' || c === 'ArrowRight' || c === 'Enter') e.preventDefault();
  keys.add(c);
  if (e.repeat || TR.active) return;
  if (c === 'KeyM') { toggleMusic(); return; }
  if (c === 'KeyN') { toggleSfx(); return; }
  if (scene === 'menu') {
    if (c === KONAMI[konamiI]) { if (++konamiI === KONAMI.length) { DEBUG = !DEBUG; konamiI = 0; sfx('ding'); } }
    else konamiI = c === KONAMI[0] ? 1 : 0;
    if (c === 'Enter' || c === 'Space') toRun();
    return;
  }
  if (!G) return;
  if (G.results) { if ((c === 'Space' || c === 'Enter') && G.resT > 40) restartRun(); else if (c === 'Escape') toMenu(); return; }
  if (G.paused) { if (c === 'Escape' || c === 'KeyP' || c === 'Enter' || c === 'Space') togglePause(); else if (c === 'KeyQ') toMenu(); return; }
  if (c === 'Escape' || c === 'KeyP') { togglePause(); return; }
  if (G.state === 'pending' && (BOOST_KEYS.has(c) || c === 'Enter')) { startRoute(); return; }
  if (G.state === 'active') {
    if (DROP_KEYS.has(c)) dropQ = true;
    if (DEBUG && c === 'Enter') spawnTraffic(P.y < H / 2 ? 'witch' : 'car');
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); pointers.clear(); if (scene === 'run' && G && G.state === 'active' && !G.paused) togglePause(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { keys.clear(); pointers.clear(); if (scene === 'run' && G && G.state === 'active' && !G.paused) togglePause(); if (AU.ctx) AU.ctx.suspend().catch(() => {}); }
  else if (AU.ctx) AU.ctx.resume().catch(() => {});
});
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 80); });

// ===================================================================
//  Main loop (fixed 60 Hz simulation, like the original room speed)
// ===================================================================
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); if (UI.pressT > 0) UI.pressT--; acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
resize();
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`400 40px "Bagel Fat One"`), document.fonts.load(`800 16px "Grandstander"`), document.fonts.load(`900 16px "Grandstander"`)]).catch(() => {});
requestAnimationFrame(frame);
window.__hexpress = { get G() { return G; }, get P() { return P; }, get scene() { return scene; } };
})();
</script>
